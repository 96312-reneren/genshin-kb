<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原神知识库 · Genshin Knowledge Base</title>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#1b2027; --ink2:#5d6773; --ink3:#8e97a3;
  --line:#e4e8ed; --line2:#eef1f5;
  --teal:#0f8c86; --teal-soft:#e7f5f4; --gold:#bc851a; --gold-soft:#fdf4e3;
  --red:#cf4a5c; --red-soft:#fdeef0; --blue:#3374c1; --blue-soft:#eaf2fc;
  --purple:#7752c4; --purple-soft:#f1ecfb; --green:#2f8f5b; --green-soft:#e9f6ef;
  --e-fire:#e2603f; --e-water:#3d8fd1; --e-wind:#3fae94; --e-thunder:#8b6ad0;
  --e-grass:#74a832; --e-ice:#5fb5d8; --e-rock:#c9a227;
  --shadow:0 1px 2px rgba(20,30,45,.05), 0 6px 18px rgba(20,30,45,.05);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.72;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- header ---------- */
header{
  background:linear-gradient(135deg,#0f8c86 0%,#0b6f6a 55%,#0a5a58 100%);
  color:#fff; padding:22px 0 20px; position:relative; overflow:hidden;
}
header::after{
  content:""; position:absolute; right:-60px; top:-60px; width:260px; height:260px;
  border-radius:50%; background:rgba(255,255,255,.06);
}
.hwrap{max-width:1180px;margin:0 auto;padding:0 22px;position:relative;z-index:2}
h1{margin:0;font-size:23px;letter-spacing:.5px;font-weight:650}
.sub{margin-top:5px;font-size:12.5px;opacity:.86;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{
  display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.24);
}
.chip.gold{background:rgba(255,214,130,.22);border-color:rgba(255,214,130,.42)}
.searchbox{margin-top:14px;position:relative;max-width:430px}
.searchbox input{
  width:100%;padding:9px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.14);color:#fff;font-size:13px;outline:none;
  font-family:inherit;
}
.searchbox input::placeholder{color:rgba(255,255,255,.7)}
.searchbox input:focus{background:rgba(255,255,255,.22);border-color:#fff}
#sr{position:absolute;left:0;right:0;top:44px;background:#fff;color:var(--ink);
  border-radius:10px;box-shadow:0 12px 32px rgba(10,30,40,.24);max-height:400px;
  overflow:auto;display:none;z-index:50;border:1px solid var(--line)}
#sr .grp{padding:8px 14px;font-size:11.5px;color:var(--ink3);background:#fafbfc;
  border-bottom:1px solid var(--line2);letter-spacing:.6px}
#sr .it{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line2);font-size:13px}
#sr .it:hover{background:var(--teal-soft)}
#sr .it small{color:var(--ink3);margin-left:8px}

/* ---------- nav ---------- */
nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nwrap{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;gap:2px;overflow-x:auto}
.nwrap button{
  border:0;background:none;font-family:inherit;font-size:13.5px;color:var(--ink2);
  padding:13px 15px 11px;cursor:pointer;border-bottom:2.5px solid transparent;
  white-space:nowrap;font-weight:500;transition:.15s;
}
.nwrap button:hover{color:var(--teal)}
.nwrap button.on{color:var(--teal);border-bottom-color:var(--teal);font-weight:650}

/* ---------- layout ---------- */
main{max-width:1180px;margin:0 auto;padding:24px 22px 70px}
section{display:none;animation:fade .22s ease}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px}
h2{font-size:18px;margin:0 0 4px;font-weight:650;letter-spacing:.3px}
h2 .en{font-size:11.5px;color:var(--ink3);font-weight:400;margin-left:8px;letter-spacing:.8px}
h3{font-size:14.5px;margin:22px 0 10px;font-weight:650;color:var(--ink);
  padding-left:10px;border-left:3px solid var(--teal)}
h3:first-child{margin-top:4px}
h4{font-size:13.5px;margin:16px 0 6px;font-weight:650;color:var(--ink2)}
p{margin:8px 0}
.lead{color:var(--ink2);font-size:13.5px;margin:6px 0 0}
.muted{color:var(--ink3);font-size:12.5px}
.hr{height:1px;background:var(--line2);margin:18px 0}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:11.5px;color:var(--ink3);letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:700;color:var(--teal);letter-spacing:-.4px;margin-top:3px;line-height:1.25}
.kpi .v small{font-size:12px;font-weight:500;color:var(--ink2);letter-spacing:0}
.kpi .n{font-size:11.5px;color:var(--ink3);margin-top:3px}
.kpi.g .v{color:var(--gold)}
.kpi.b .v{color:var(--blue)}
.kpi.p .v{color:var(--purple)}

/* ---------- flow ---------- */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:6px 0}
.fnode{flex:1 1 150px;min-width:132px;background:#fbfcfd;border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;position:relative}
.fnode .num{display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--teal);
  color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-bottom:5px}
.fnode b{display:block;font-size:12.8px;font-weight:650;margin-bottom:2px}
.fnode span{font-size:11.5px;color:var(--ink2);line-height:1.6;display:block}
.fnode.pay{background:var(--gold-soft);border-color:#f0dfbb}
.fnode.pay .num{background:var(--gold)}
.farrow{display:flex;align-items:center;color:var(--ink3);font-size:16px;flex:0 0 auto}
.loopback{margin-top:10px;background:var(--gold-soft);border:1px dashed #e3cb96;
  border-radius:10px;padding:9px 14px;font-size:12.5px;color:#8a6414}

/* ---------- timeline ---------- */
.tl{display:flex;margin:8px 0 4px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.tl div{flex:1;padding:10px 12px;font-size:12px;background:#fbfcfd;border-right:1px solid var(--line)}
.tl div:last-child{border-right:0}
.tl .half1{background:var(--teal-soft)}
.tl .half2{background:#fdf1ec}
.tl b{display:block;font-size:12.8px;margin-bottom:2px}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:9px;margin:6px 0}
.brow{display:grid;grid-template-columns:150px 1fr 92px;gap:10px;align-items:center;font-size:12.5px}
.brow .lb{color:var(--ink2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .tr{background:var(--line2);border-radius:5px;height:20px;overflow:hidden}
.brow .fl{height:100%;border-radius:5px;background:var(--teal);transition:width .5s}
.brow .vl{font-weight:650;color:var(--ink);font-size:12.5px}
@media(max-width:640px){.brow{grid-template-columns:104px 1fr 74px;font-size:11.5px}}

.stackbar{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:5px 0;border:1px solid var(--line)}
.stackbar i{display:block;height:100%;transition:.4s}
.sklabel{display:flex;justify-content:space-between;font-size:12.5px;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- tags ---------- */
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.2px;
  background:var(--teal-soft);color:#0b6f6a;margin:0 5px 5px 0;border:1px solid #d3ece9}
.tag.gold{background:var(--gold-soft);color:#8a6414;border-color:#f0dfbb}
.tag.blue{background:var(--blue-soft);color:#23579a;border-color:#d3e4f7}
.tag.purple{background:var(--purple-soft);color:#553a92;border-color:#e2d8f6}
.tag.red{background:var(--red-soft);color:#a83445;border-color:#f7d7dc}
.tag.gray{background:#f1f3f6;color:var(--ink2);border-color:var(--line)}

.el{display:inline-flex;align-items:center;gap:4px;font-size:11.2px;color:#fff;
  padding:1px 8px;border-radius:20px;font-weight:600}
.el.火{background:var(--e-fire)} .el.水{background:var(--e-water)}
.el.风{background:var(--e-wind)} .el.雷{background:var(--e-thunder)}
.el.草{background:var(--e-grass)} .el.冰{background:var(--e-ice)}
.el.岩{background:var(--e-rock)}

/* ---------- buttons ---------- */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 16px}
.filters button{border:1px solid var(--line);background:#fff;font-family:inherit;
  font-size:12.5px;padding:5px 13px;border-radius:20px;cursor:pointer;color:var(--ink2);transition:.15s}
.filters button:hover{border-color:var(--teal);color:var(--teal)}
.filters button.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}

/* ---------- teams ---------- */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(342px,1fr));gap:14px}
@media(max-width:760px){.teams{grid-template-columns:1fr}}
.team{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.team .th{padding:15px 18px 12px;border-bottom:1px solid var(--line2)}
.team .th .nm{font-size:15px;font-weight:650;display:flex;justify-content:space-between;
  align-items:flex-start;gap:10px}
.team .th .nm .arch{font-size:11.5px;color:var(--teal);background:var(--teal-soft);
  padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap;flex:0 0 auto}
.team .th .tg{margin-top:8px}
.team .tb{padding:12px 18px 16px}
.team .sum{font-size:13px;color:var(--ink2);margin:0}
.team details{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
.team details:first-of-type{border-top:0;padding-top:0;margin-top:12px}
.team summary{cursor:pointer;font-size:12.6px;font-weight:650;color:var(--teal);
  list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
.team summary::-webkit-details-marker{display:none}
.team summary::before{content:"▸";font-size:11px;transition:.18s;display:inline-block}
.team details[open] summary::before{transform:rotate(90deg)}
.team details > div{font-size:12.7px;color:var(--ink2);padding:8px 0 2px 15px;line-height:1.75}
.mem{display:flex;gap:9px;padding:6px 0;border-bottom:1px dotted var(--line2);font-size:12.7px}
.mem:last-child{border-bottom:0}
.mem .sl{flex:0 0 74px;color:var(--teal);font-weight:650}
.mem .cn{flex:0 0 auto;font-weight:600}
.mem .rn{color:var(--ink2);flex:1}

/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12.7px;min-width:560px}
th{text-align:left;padding:9px 11px;background:#f8fafb;color:var(--ink2);font-weight:650;
  border-bottom:1.5px solid var(--line);white-space:nowrap;font-size:12.2px}
td{padding:9px 11px;border-bottom:1px solid var(--line2);vertical-align:top;color:var(--ink)}
tbody tr:hover{background:#fafcfd}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- calculator ---------- */
.calc{background:#fafcfd;border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-top:6px}
.crow{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11.8px;color:var(--ink2)}
.fld input,.fld select{font-family:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);
  border-radius:7px;background:#fff;color:var(--ink);outline:none;min-width:96px}
.fld input:focus,.fld select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,140,134,.1)}
.fld input[type=range]{min-width:150px;padding:0;border:0;background:none}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-top:12px}
.out div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.out .k{font-size:11.3px;color:var(--ink3)}
.out .v{font-size:18px;font-weight:700;color:var(--teal);letter-spacing:-.3px}
.out .v.warn{color:var(--red)}
.out .v.good{color:var(--green)}

/* ---------- misc ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:14px}
.note{background:var(--blue-soft);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;
  padding:10px 14px;font-size:12.7px;color:#1f4e84;margin:12px 0}
.note.warn{background:var(--red-soft);border-left-color:var(--red);color:#8f2f3d}
.note.ok{background:var(--green-soft);border-left-color:var(--green);color:#1f6b41}
.ops{counter-reset:o}
.op{border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden;background:var(--card)}
.op summary{cursor:pointer;padding:13px 17px;font-size:13.6px;font-weight:650;list-style:none;
  display:flex;gap:11px;align-items:center;user-select:none}
.op summary::-webkit-details-marker{display:none}
.op summary::before{counter-increment:o;content:counter(o);flex:0 0 22px;height:22px;
  background:var(--teal-soft);color:var(--teal);border-radius:50%;font-size:11.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.op summary:hover{background:#fbfcfd}
.op[open] summary{border-bottom:1px solid var(--line2);background:#fbfcfd}
.op .bd{padding:14px 18px 18px}
.lk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:640px){.lk{grid-template-columns:1fr}}
.lk div{background:#fafcfd;border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:12.6px;color:var(--ink2)}
.lk div b{display:block;color:var(--ink);font-size:12px;margin-bottom:3px}
.lk .join{background:var(--teal-soft);border-color:#d3ece9;grid-column:1/-1;color:#0b5c58}
.ana{font-size:13.2px;color:var(--ink);line-height:1.85;border-left:3px solid var(--gold);
  padding-left:14px;background:linear-gradient(90deg,rgba(253,244,227,.5),transparent 60%)}
footer{border-top:1px solid var(--line);padding:22px;text-align:center;color:var(--ink3);font-size:12px}
ul.tight{margin:6px 0;padding-left:20px}
ul.tight li{margin:3px 0;font-size:13px}
code{background:#f1f3f6;padding:1px 6px;border-radius:4px;font-size:12.2px;
  font-family:ui-monospace,Menlo,Consolas,monospace;color:#0b6f6a}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;
  background:#f1f3f6;color:var(--ink2);border:1px solid var(--line)}
.pill.warnp{background:var(--red-soft);color:#a83445;border-color:#f7d7dc}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <h1>原神知识库 <span style="font-weight:400;font-size:15px;opacity:.8">Genshin Knowledge Base</span></h1>
    <div class="sub">
      <span class="chip" id="chipVer">数据基准 · 加载中</span>
      <span class="chip">SQLite 24 张表</span>
      <span class="chip gold">仅供个人学习与研究</span>
    </div>
    <div class="searchbox">
      <input id="q" type="text" placeholder="搜索队伍 / 角色 / 机制 / 运营主题…" autocomplete="off">
      <div id="sr"></div>
    </div>
  </div>
</header>

<nav><div class="nwrap" id="nav"></div></nav>

<main>
  <section id="tab-overview"></section>
  <section id="tab-teams"></section>
  <section id="tab-abyss"></section>

  <section id="tab-materials"></section>
  <section id="tab-resources"></section>
  <section id="tab-chars"></section>
  <section id="tab-data"></section>
</main>

胡桃蒸发（单核持续输出）","archetype":"蒸发","core_reaction":"火×水 → 蒸发","cost_level":"中","difficulty":"中","summary":"以行秋提供稳定水附着，胡桃开血梅香后用火元素普攻/重击持续触发蒸发（火打水附着为 2.0 倍）。钟离的护盾是这套队成立的前提——它把「低血量高攻击」这个风险设计与生存需求解耦。","rotation":"钟离E开盾 → 行秋E/Q挂水 → 万叶/夜兰等增益 → 胡桃E进入血梅香 → 普攻·重击循环 → E结束前用Q收尾。","strengths":"单体输出极高；循环自洽、对练度宽容度高；四星位（行秋）可用。","weaknesses":"依赖挂水节奏，断水即断伤害；血量管理有暴毙风险；重击手感吃操作。","abyss_fit":"单体 BOSS 层、站桩输出环境最佳；对需频繁走位/打断的层数表现下降。","tags":"蒸发,火,单核,热门"},{"id":2,"name":"宵宫蒸发（操作最简）","archetype":"蒸发","core_reaction":"火×水 → 蒸发","cost_level":"中","difficulty":"低","summary":"宵宫以普攻为核心，配合行秋的水附着打蒸发。整套队的理解成本极低，适合当作「第一套能稳定满星的队伍」。","rotation":"钟离E → 行秋E/Q → 班尼特E/Q → 宵宫E进入温存 → 普攻循环。","strengths":"操作门槛低、循环稳定、对单体持续输出强。","weaknesses":"需要站桩，怕打断与位移；爆发不足，短窗口层数吃亏。","abyss_fit":"单体或少量精英怪；不擅长应对大量分散小怪。","tags":"蒸发,火,低门槛"},{"id":3,"name":"神里绫华永冻（控场流）","archetype":"冻结","core_reaction":"水×冰 → 冻结","cost_level":"高","difficulty":"中","summary":"心海挂水 + 绫华冰元素形成冻结，把敌人钉在原地；万叶聚怪并减抗，申鹤为冰元素加成。冻结的价值不只是控制——它同时消除了敌人的位移与攻击，等于把「操作」这个变量从对局里拿掉。","rotation":"心海E挂水 → 万叶E聚怪+减抗 → 申鹤E增伤 → 绫华Q(冰霜风暴) → 重击循环补刀。","strengths":"群体伤害高；控制力极强；容错率高，适合手速一般的玩家。","weaknesses":"对免疫冻结的 BOSS 效果大打折扣；占用三名五星辅助，成本高。","abyss_fit":"大量小怪层、需要控场的高压层；对冻结免疫的 BOSS 层需换队。","tags":"冻结,冰,控制,群体"},{"id":4,"name":"甘雨融化（远程爆发）","archetype":"融化","core_reaction":"火×冰 → 融化","cost_level":"中","difficulty":"高","summary":"香菱提供后台火附着，甘雨的霜华矢命中触发融化（火打冰附着为 2.0 倍），以蓄力重击为核心输出。这是全游戏射程最远的输出模式，代价是每一次蓄力都要用时间去换伤害。","rotation":"钟离E → 香菱E/Q挂火 → 班尼特Q增伤 → 甘雨蓄力重击循环。","strengths":"射程极远、单发伤害高；对站位要求低。","weaknesses":"蓄力耗时，怕打断与走位；操作门槛高；对需要快速清场的层数不适应。","abyss_fit":"单体 BOSS、可远距离站桩的层数。","tags":"融化,冰,远程,高操作"},{"id":5,"name":"国家队（四星通用骨架）","archetype":"蒸发/超载混合","core_reaction":"火×水 → 蒸发；火×雷 → 超载","cost_level":"低","difficulty":"中","summary":"香菱+行秋+班尼特构成的「输出-挂水-增益/治疗」三角，是全游戏性价比最高的骨架。它的意义不在于强度上限，而在于证明了「四星也能打满深渊」这件事在这个游戏里是成立的。","rotation":"班尼特E/Q → 行秋E/Q → 香菱E/Q → 第四位补循环，靠技能与爆发轮转输出。","strengths":"全四星可成型、零成本；群体伤害强；循环自洽、不依赖特定五星。","weaknesses":"没有爆发段；严重依赖元素能量循环，需堆充能效率；单体上限一般。","abyss_fit":"群体小怪层的最优性价比选择；深渊 9-10 层保底利器。","tags":"四星,低金,群体,骨架"},{"id":6,"name":"雷神国家队（循环之王）","archetype":"蒸发/充能","core_reaction":"火×水 → 蒸发","cost_level":"中","difficulty":"中","summary":"雷电将军以充能效率为核心属性，为全队提供能量回收，同时自身爆发输出。这套队的真正卖点是「循环永不卡死」，在需要连续处理多波怪物的层数里几乎没有替代品。","rotation":"班尼特E/Q → 行秋E/Q → 香菱E/Q → 雷神Q(梦想真说) → 普攻循环回能。","strengths":"循环极稳、伤害足、容错好；对多波次敌人的持续压制力强。","weaknesses":"高度依赖雷电将军；对充能配置有要求；爆发窗口固定。","abyss_fit":"多波次小怪层、需要长线持续输出的层数。","tags":"雷,蒸发,循环,主流"},{"id":7,"name":"妮露绽放（体系专属）","archetype":"绽放","core_reaction":"草×水 → 绽放（丰沃之核）","cost_level":"中","difficulty":"低","summary":"妮露的天赋把「绽放」产物升级为伤害与范围都大幅强化的丰沃之核，全队输出完全建立在绽放反应上。代价是队伍必须严格限定为水+草，等于用「队伍自由度」换「廉价的群体伤害」。","rotation":"纳西妲E挂草 → 行秋/心海E挂水 → 触发绽放 → 妮露E/Q强化核心 → 循环刷新。","strengths":"群体伤害爆炸；不吃暴击、不吃圣遗物副词条，成型极快；操作简单。","weaknesses":"队伍元素被锁死（只允许水+草）；对单体 BOSS 效果一般；怕火/冰元素污染。","abyss_fit":"大量小怪层的最强解之一；对单 BOSS 层较弱。","tags":"绽放,水草,群体,低成本"},{"id":8,"name":"超绽放（性价比毕业队）","archetype":"超绽放","core_reaction":"草×水 → 草原核；雷触发 → 超绽放","cost_level":"低","difficulty":"低","summary":"纳西妲挂草 + 水附着生成草原核，再由久岐忍触发超绽放。关键点是超绽放伤害只与触发角色的等级和元素精通有关——这意味着它绕过了整个「暴击词条堆叠」的养成体系，是游戏里最快能打满深渊的方案之一。","rotation":"纳西妲E → 行秋/夜兰E/Q挂水 → 久岐忍E持续挂雷触发 → 循环刷新。","strengths":"成本极低（核心仅需纳西妲+久岐忍）；不需刷暴击副词条；对群对单皆可；下限极高。","weaknesses":"吃元素精通主词条；单体伤害上限不如蒸发/融化；需要稳定的挂雷频率。","abyss_fit":"几乎通杀，是新手与老玩家的通用保险队。","tags":"超绽放,草雷,低金,通用"},{"id":9,"name":"激化队（草雷单体）","archetype":"激化","core_reaction":"草×雷 → 原激化 → 超激化/蔓激化","cost_level":"中","difficulty":"中","summary":"纳西妲提供持续草附着并触发原激化，主C（艾尔海森/赛诺）打出的攻击被激化为超激化/蔓激化，单次伤害获得固定加成。这是「提升每一次攻击」而非「提升某一段爆发」的思路。","rotation":"纳西妲E → 钟离E开盾 → 八重神子E挂雷 → 主C输出循环。","strengths":"单体伤害高；副C位替换自由；对练度要求平滑。","weaknesses":"上限依赖主C与纳西妲练度；怕元素污染打断激化。","abyss_fit":"单体 BOSS 与精英怪层。","tags":"激化,草雷,单体"},{"id":10,"name":"雷九万班（爆发核心）","archetype":"纯色爆发","core_reaction":"—（增益叠加）","cost_level":"高","difficulty":"高","summary":"全队服务雷电将军一人：九条裟罗提供雷元素加成、万叶减抗聚怪、班尼特攻击加成，把增益在同一个窗口内全部叠满，由雷神大招收尾。这是典型的「窗口期爆发」结构。","rotation":"万叶E → 班尼特E/Q → 九条裟罗E → 雷神Q → 窗口内打满 → 循环。","strengths":"爆发极高、循环优秀；对 BOSS 层压制力强。","weaknesses":"需要较高练度与命座（尤其九条裟罗）；对增益窗口的熟练度要求高。","abyss_fit":"单体 BOSS、有明确爆发窗口的层数。","tags":"雷,爆发,高练度"},{"id":11,"name":"芙宁娜通用增伤体系","archetype":"通用增幅","core_reaction":"—（生命值波动驱动的增伤）","cost_level":"中","difficulty":"中","summary":"芙宁娜依据全队生命值的变化量提供大量增伤，因此队里必须同时存在「会自我耗血的主C」与「能治疗的辅助」，让生命值持续上下波动。她不是某个体系的零件，而是一个可以插进多数队伍的增益层。","rotation":"芙宁娜E(挂后台)→ Q开启增伤 → 治疗角色维持血量波动 → 主C输出。","strengths":"通用性极强，几乎可搭配任何主C；增伤幅度大。","weaknesses":"需要治疗角色配合，队伍构建受约束；启动需要暖机时间。","abyss_fit":"几乎所有需要输出上限的层数。","tags":"水,增伤,通用"},{"id":12,"name":"那维莱特体系（范围压制）","archetype":"水元素直伤","core_reaction":"—（水元素范围伤害）","cost_level":"中","difficulty":"低","summary":"那维莱特以蓄力重击造成大范围水元素伤害，且其天赋对队伍其他角色的生命值变动有额外加成要求。因此理想搭配是「能改变队友血量的辅助 + 护盾」，把它变成一个可以稳定站桩的范围清场机器。","rotation":"钟离E开盾 → 芙宁娜E/Q → 万叶E聚怪减抗 → 那维莱特蓄力重击循环。","strengths":"范围伤害强、操作简单、对群效率极高。","weaknesses":"需护盾保护蓄力过程；单体爆发一般；对打断敏感。","abyss_fit":"大量小怪层、需要快速清场的层数。","tags":"水,范围,低门槛"},{"id":13,"name":"岩队（一斗 / 娜维娅）","archetype":"纯色","core_reaction":"岩×元素 → 结晶（护盾碎片）","cost_level":"中","difficulty":"低","summary":"岩元素不参与增幅反应，输出完全依靠固定数值增益（五郎、云堇一类）与护盾提供的稳定输出环境。它的优势恰恰来自「没有反应」——不必担心元素附着被污染，输出曲线极其平稳。","rotation":"钟离E开盾 → 五郎/云堇E/Q提供增益 → 主C站场输出循环。","strengths":"输出稳定、操作简单、不受元素反应干扰。","weaknesses":"伤害上限有限；对需要特定元素破盾的机制几乎无解；队伍泛用性差。","abyss_fit":"无特殊机制要求、纯粹考验输出的层数。","tags":"岩,纯色,稳定"},{"id":14,"name":"优菈物理队（物理伤害特化）","archetype":"物理","core_reaction":"冰×雷 → 超导（物理抗性降低）","cost_level":"中","difficulty":"高","summary":"优菈的大招光降之剑是物理伤害，配合雷元素触发超导降低敌人物理抗性；双冰共鸣再提供对冰元素/冻结目标的暴击率加成。这是游戏里少数完全绕开元素反应的输出路线。","rotation":"钟离E → 罗莎莉亚E/Q → 雷电将军E挂雷触发超导 → 优菈E起手 → Q爆发 → 普攻叠加光子层 → 斩击结算。","strengths":"单点爆发极高，结算瞬间的爽感独一份。","weaknesses":"需要攒能量，怕打断；物理伤害遇到高物抗敌人会直接崩盘；操作门槛高。","abyss_fit":"无高物抗的单体 BOSS 层。","tags":"物理,优菈,爆发"},{"id":15,"name":"魈风队（下落攻击特化）","archetype":"纯色爆发","core_reaction":"—（风元素直伤）","cost_level":"中","difficulty":"中","summary":"魈以「下落攻击」为主要输出手段，风元素伤害配合万叶/珐露珊的减抗与增益。这套队的节奏感极强——起跳、下落、再起跳，是原神里手感最有辨识度的玩法之一。","rotation":"钟离E开盾 → 班尼特Q → 万叶E减抗 → 魈Q(降魔·平妖大圣) → 连续下落攻击。","strengths":"爆发高、手感独特、群体伤害不错。","weaknesses":"下落期间极度依赖护盾，怕打断；需要持续治疗；对站位有要求。","abyss_fit":"需要高爆发清场的层数。","t rs":3,"halves":2,"typical_enemies":"高层次精英怪组合","environment":"无","reward_note":"一次性奖励（首通）"},{"floor":9,"chambers":3,"halves":2,"typical_enemies":"精英怪+群体小怪混合","environment":"可能有轻量环境效果","reward_note":"每期刷新，每层满星约 150 原石"},{"floor":10,"chambers":3,"halves":2,"typical_enemies":"精英怪+群体小怪混合","environment":"可能有轻量环境效果","reward_note":"每期刷新，每层满星约 150 原石"},{"floor":11,"chambers":3,"halves":2,"typical_enemies":"高血量精英怪，开始出现明显机制要求","environment":"常见地脉异常（如元素充能效率降低）","reward_note":"每期刷新，每层满星约 150 原石"},{"floor":12,"chambers":3,"halves":2,"typical_enemies":"多阶段 BOSS、次数盾敌人、复合精英怪组合","environment":"地脉异常 + 渊月祝福双重叠加","reward_note":"每期刷新，每层满星约 150 原石；最高难度分水岭"}],"abyss_rewards":[{"id":1,"scope":"1-8层","item":"原石 + 摩拉 + 圣遗物素材","amount":"一次性，满星合计约 2400 原石量级","period":"一次性","note":"仅在首次满星时结算，之后不再刷新，属开荒福利。"},{"id":2,"scope":"9-12层","item":"原石","amount":"每层满星 150 原石；每间 50 原石","period":"每半月刷新","note":"12 层满星合计 600 原石/期，每月两期约 1200 原石，是零氪最稳定的抽卡资源来源。"},{"id":3,"scope":"9-12层","item":"圣遗物","amount":"每层通关掉落，12 层必出金色圣遗物","period":"每期刷新","note":"高难度层的圣遗物掉落品质优于普通秘境，是额外的刷取渠道。"},{"id":4,"scope":"9-12层","item":"纪念名片","amount":"满星专属名片","period":"每期刷新","note":"无属性加成，性质等同于练度证明。"},{"id":5,"scope":"9-12层","item":"无主的星辉 / 星尘等副产物","amount":"按结算发放","period":"每期刷新","note":"可用于商店兑换纠缠之缘与相遇之缘，是间接的抽卡资源。"}],"abyss_mechanics":[{"id":1,"name":"楼层结构","category":"结构","description":"共 12 层，每层 3 间。第 1-4 层为单队挑战；自第 5 层起每间分为上半与下半，需要准备两支不同队伍。","strategy":"配队时至少准备两支能独立运转的队伍，避免两支都依赖同一名核心辅助。"},{"id":2,"name":"星级与时间","category":"结构","description":"每间最高 3 星，一层最多 9 星。星级取决于在时间限制内完成挑战的剩余时间，剩余越多星级越高。","strategy":"时间限制与星级门槛以当期游戏内显示为准；优先保证「不超时」再考虑抢时间。"},{"id":3,"name":"逐间独立挑战与星级累计","category":"结构","description":"每间可单独挑战，已获得的星数不会因重新挑战而清空。可以分批、分天完成。","strategy":"打不过的层不必硬凹：先把能拿的星拿到，练度提升后再回来补。奖励按已得星数结算。"},{"id":4,"name":"渊月祝福","category":"环境","description":"每期深境螺旋轮换的全局增益，通常对应当期活跃的元素或反应机制。","strategy":"这是官方的「隐性推荐配队」信号：祝福强化的方向往往就是当期最省力的解法，但并非唯一解。"},{"id":5,"name":"地脉异常","category":"环境","description":"每层特有的环境效果，多为减益性质，例如元素充能效率降低、生命值上限降低等。","strategy":"高层的地脉异常会直接改变循环节奏：充电受阻时需提高充能效率，血量受限时护盾与治疗优先级上升。"},{"id":6,"name":"元素护盾（深渊使徒/咏者、深渊法师）","category":"敌人","description":"部分敌人拥有元素护盾，需用相克的元素破盾；护盾存在期间本体几乎不受伤。","strategy":"通用经验：水盾用冰或雷；火盾用水；冰盾用火；雷盾用火或冰；岩盾用岩或双手剑（超载亦可）。具体以当期敌人说明为准。"},{"id":7,"name":"次数盾","category":"敌人","description":"部分敌人（如深渊使徒/咏者类）的护盾按「受击次数」而非伤害量消减。","strategy":"高频攻击角色与多段伤害技能对次数盾效率极高；单体大招流反而吃亏。"},{"id":8,"name":"多阶段 BOSS","category":"敌人","description":"高层常见需要满足条件才能推进阶段的 BOSS，例如需要特定元素攻击、或先处理召唤物才能破除高抗性。","strategy":"进本前先看一眼当期怪物构成，把「机制解法」写进配队计划，比事后硬凹省时间得多。"},{"id":9,"name":"不可使用食物","category":"策略","description":"深境螺旋内无法使用料理回复，生存完全依赖队伍自身的护盾与治疗。","strategy":"护盾或治疗位在高难度层几乎是刚需；无治疗无护盾的队伍容错极低。"},{"id":10,"name":"双队分工","category":"策略","description":"每层上下半需要两支队伍，且角色不可重复使用。","strategy":"常见分工：一队负责单体高爆发（打 BOSS），一队负责范围清场（清小怪群），按当层怪物构成调换。"}],"monetization":[{"id":1,"name":"空月祝福（小月卡）","price_cny":30.0,"kind":"月卡","contents":"购买即得创世结晶 ×300；生效 30 天内每日可领原石 ×90（漏领不补）。合计约 3000 原石当量。","primogem_equiv":3000,"pulls_equiv":18.75,"cny_per_pull":1.6,"design_intent":"全游戏性价比最高的付费项，比直充便宜约 10 倍。它的真实功能是「绑定每日登录」——原石必须每天上线领取且不补发，用 30 元的低门槛换玩家一个月的日活。同时它也是多数玩家的第一次付费，跨过这道门槛后继续付费的概率显著上升。"},{"id":2,"name":"珍珠纪行（大月卡）","price_cny":68.0,"kind":"通行证","contents":"纪行付费轨奖励：纠缠之缘、摩拉、经验书、天赋素材、纪行武器（4★）、脆弱树脂等，并额外提供 5 个脆弱树脂。","primogem_equiv":1320,"pulls_equiv":8.25,"cny_per_pull":8.24,"design_intent":"奖励全部指向「养成资源」而非「抽卡资源」，卖的是养成速度。它把付费与活跃度挂钩：越活跃越有动力买，买了之后越舍不得中断。对想打深渊但树脂不够的玩家，这是最直接的解压阀。"},{"id":3,"name":"珍珠之歌","price_cny":128.0,"kind":"通行证","contents":"珍珠纪行全部内容 + 立即提升 10 级纪行等级 + 当期名片 + 限定家具图纸 + 脆弱树脂 ×5 + 启圣之尘 ×1。","primogem_equiv":null,"pulls_equiv":null,"cny_per_pull":null,"design_intent":"面向「不想花时间刷纪行等级、直接拿满奖励」的玩家的加价档。本质是把纪行的时间成本也做成一项可以购买的商品。"},{"id":4,"name":"创世结晶直充（6 档）","price_cny":648.0,"kind":"直充","contents":"60 / 300 / 980 / 1980 / 3280 / 6480 共六档；创世结晶与原石按 1:1 兑换；各档首次购买翻倍。以 648 档计约 6480 原石 ≈ 40.5 抽。","primogem_equiv":6480,"pulls_equiv":40.5,"cny_per_pull":16.0,"design_intent":"最贵的付费方式，服务的是「确定性需求」：当距离大保底还差几十抽、而卡池即将关闭时，直充是唯一的选择。首充双倍是一次性的转化钩子，用一次性的便宜换一个长期的付费习惯。"},{"id":5,"name":"角色装扮（皮肤）","price_cny":1680.0,"kind":"外观","contents":"以创世结晶计价，通常 1680 结晶；部分更高档位为 2480 结晶。仅改变外观，不影响任何数值。","primogem_equiv":1680,"pulls_equiv":10.5,"cny_per_pull":160.0,"design_intent":"最「安全」的付费点：不破坏数值平衡，不会让不付费玩家产生被碾压的感受，却为高付费用户提供了表达欲与身份展示的出口。对以角色情感联结为核心的产品，外观付费是利润率最高、争议最小的部分。"}],"crystals":[{"id":1,"price_cny":6.0,"crystals":60,"is_first_double":0,"note":"最低档，常见于小额试用"},{"id":2,"price_cny":30.0,"crystals":300,"is_first_double":0,"note":"与月卡同价，但月卡性价比远高于此档"},{"id":3,"price_cny":98.0,"crystals":980,"is_first_double":0,"note":"—"},{"id":4,"price_cny":198.0,"crystals":1980,"is_first_double":0,"note":"—"},{"id":5,"price_cny":328.0,"crystals":3280,"is_first_double":0,"note":"—"},{"id":6,"price_cny":648.0,"crystals":6480,"is_first_double":0,"note":"最高档，单抽成本最低的非月卡选项"},{"id":7,"price_cny":648.0,"crystals":12960,"is_first_double":1,"note":"首充双倍后：约 8.0 元/抽"}],"primogem_income":[{"id":1,"source":"每日委托","amount_low":2520,"amount_high":2520,"period":"每 42 天（一版本）","player_type":"0氪","note":"60 原石/天 × 42 天。全勤是免费资源的基本盘。"},{"id":2,"source":"深境螺旋 9-12 层","amount_low":1680,"amount_high":1800,"period":"每 42 天（一版本）","player_type":"0氪","note":"600 原石/期 × 约 2.8 期。半月刷新一次，是免费资源里唯一需要练度的部分。"},{"id":3,"source":"幻想真境剧诗","amount_low":400,"amount_high":600,"period":"每期","player_type":"0氪","note":"常驻高难玩法，与深渊并列。奖励以游戏内为准，此处为社区量级估算。"},{"id":4,"source":"版本限时活动","amount_low":2000,"amount_high":4000,"period":"每 42 天（一版本）","player_type":"0氪","note":"版本主题活动 + 阶段性活动的原石合计；浮动较大。"},{"id":5,"source":"版本更新补偿与签到","amount_low":600,"amount_high":900,"period":"每 42 天（一版本）","player_type":"0氪","note":"版本更新补偿、版本登录签到等。"},{"id":6,"source":"纪行免费轨","amount_low":800,"amount_high":800,"period":"每 42 天（一版本）","player_type":"0氪","note":"5 个纠缠之缘 ≈ 800 原石当量。"},{"id":7,"source":"新地图探索（仅含新地图的版本）","amount_low":2000,"amount_high":4000,"period":"不定期","player_type":"0氪","note":"宝箱、神瞳、任务奖励。拉开「大版本」与「小版本」免费产出差距的主要变量。"},{"id":8,"source":"空月祝福（月卡）","amount_low":2700,"amount_high":2700,"period":"每 30 天","player_type":"月卡","note":"90 原石/天 × 30 天，另加购买时获得的 300 创世结晶。"},{"id":9,"source":"珍珠纪行付费轨","amount_low":1320,"amount_high":1320,"period":"每 42 天（一版本）","player_type":"月卡+纪行","note":"680 原石 + 4 个纠缠之缘（≈640 原石）等。"}],"gacha":[{"id":1,"banner":"角色活动祈愿","rarity":"5★","base_rate":"0.600%","comprehensive_rate":"1.600%","hard_pity":90,"soft_pity_start":74,"avg_pulls":"约 62.5 抽","up_rate":"50%（含捕获明光约 55%）","guarantee_rule":"小保底 90 抽；未出当期 UP 则下次必出（大保底），最坏 180 抽。5.0 起新增「捕获明光」：连续三次小保底未出 UP 后，下一次必触发。","cost_primogems":160,"note":"反复歪的挫败感由捕获明光兜底，长期抽卡的体验更接近「分期购买」。"},{"id":2,"banner":"角色活动祈愿","rarity":"4★","base_rate":"5.100%","comprehensive_rate":"13.000%","hard_pity":10,"soft_pity_start":null,"avg_pulls":"约 7-8 抽","up_rate":"50%（每 2 次必出 UP）","guarantee_rule":"每 10 抽必出 4★ 及以上；4★ UP 保底不影响 5★ 计数。","cost_primogems":160,"note":"四星陪跑是抽五星时的附带收益。"},{"id":3,"banner":"武器活动祈愿（神铸赋形）","rarity":"5★","base_rate":"0.700%","comprehensive_rate":"1.850%","hard_pity":80,"soft_pity_start":63,"avg_pulls":"约 53 抽","up_rate":"75%（另 25% 为常驻武器）","guarantee_rule":"硬保底 80 抽。神铸定轨：抽到非定轨的 5★ 武器累积 1 点命定值，5.0 起命定值上限由 2 点降为 1 点，最坏 160 抽必得目标武器。注意：只有抽到另一把当期武器才给命定值，抽到常驻武器不给。","cost_primogems":160,"note":"定轨是「确定性商品化」的典型：把随机性风险明码标价，降低付费决策门槛。"},{"id":4,"banner":"武器活动祈愿","rarity":"4★","base_rate":"6.000%","comprehensive_rate":"14.500%","hard_pity":10,"soft_pity_start":null,"avg_pulls":"约 7-8 抽","up_rate":"75%","guarantee_rule":"每 10 抽必出 4★ 及以上；出非 UP 则下次必出 UP。","cost_primogems":160,"note":"—"},{"id":5,"banner":"常驻祈愿（奔行世间）","rarity":"5★","base_rate":"0.600%","comprehensive_rate":"1.600%","hard_pity":90,"soft_pity_start":74,"avg_pulls":"约 62.5 抽","up_rate":"无 UP","guarantee_rule":"90 抽硬保底；无大小保底，5★ 角色/武器随机。累计 300 抽可自选一名常驻 5★ 角色（仅一次）。使用「相遇之缘」，与活动祈愿计数互不相通。","cost_primogems":160,"note":"常驻池是「保底池」——不建议用原石投入，用系统赠送的相遇之缘即可。"},{"id":6,"banner":"集录祈愿","rarity":"5★","base_rate":"0.600%","comprehensive_rate":"1.600%","hard_pity":90,"soft_pity_start":74,"avg_pulls":"约 62.5 抽","up_rate":"50%（定轨目标）","guarantee_rule":"4.5 版本新增，不定期开放。可在给定名单中定轨一名角色或武器，命定值上限 1 点；抽数计数跨期继承，但大小保底状态不继承。","cost_primogems":160,"note":"给老角色开的第二条复刻通道，本质是把「角色库存」变成可长期运营的资产。"},{"id":7,"banner":"初行者祈愿（新手池）","rarity":"—","base_rate":"—","comprehensive_rate":"—","hard_pity":null,"soft_pity_start":null,"avg_pulls":"—","up_rate":"—","guarantee_rule":"首十连必得诺艾尔，首次十连 8 折（8 个相遇之缘）；上限 20 抽，抽满即永久关闭。","cost_primogems":128,"note":"新手引导型卡池，用一次折扣换取早期的正反馈。"}],"resources":[{"id":1,"name":"祝圣秘境（圣遗物）","resin_cost":20,"weekly_limit":"无","output":"圣遗物（45 级后稳定出金色）","priority":"中后期最高","note":"养成曲线里最深的一口井，副词条随机性决定了刷取周期可能极长。"},{"id":2,"name":"炼武秘境（武器突破素材）","resin_cost":20,"weekly_limit":"无（按日期轮换）","output":"武器突破素材","priority":"中","note":"素材按星期轮换，规划不当会白白等待。"},{"id":3,"name":"精通秘境（角色天赋素材）","resin_cost":20,"weekly_limit":"无（按日期轮换）","output":"天赋升级素材","priority":"中","note":"天赋等级对输出的边际收益在 6-9 级之间最明显。"},{"id":4,"name":"地脉衍出·启示之花","resin_cost":20,"weekly_limit":"无","output":"角色经验素材（经验书）","priority":"前期高","note":"前期缺经验书时优先级很高，后期需求下降。"},{"id":5,"name":"地脉衍出·藏金之花","resin_cost":20,"weekly_limit":"无","output":"摩拉","priority":"中期起高","note":"摩拉在新角色/新武器同步培养时最容易见底。"},{"id":6,"name":"世界 BOSS（首领会敌人）","resin_cost":40,"weekly_limit":"无","output":"角色突破素材、圣遗物","priority":"突破期高","note":"每个角色突破都需要对应 BOSS 素材，属于刚性消耗。"},{"id":7,"name":"周常 BOSS（征讨领域）","resin_cost":60,"weekly_limit":"每周前 3 次 30 点，其后 60 点","output":"角色天赋高级素材、武器原胚、异梦溶媒","priority":"每周必做","note":"每周只能用半价打 3 次，是性价比最高的树脂去处之一。"},{"id":8,"name":"魔晶块锻造（精锻用魔矿）","resin_cost":10,"weekly_limit":"无","output":"武器经验素材","priority":"低","note":"3 个魔晶块 + 10 点树脂，属于树脂没处用时的补充通道。"}],"operations":[{"id":1,"seq":1,"topic":"42 天版本节奏 × 双卡池","content_side":"每个版本约 42 天（6 周），更新 1-2 名新五星角色、配套新武器、新地图或新剧情、若干限时活动；卡池分为上半与下半两段，各约 21 天。","monetization_side":"每个版本提供两次角色池、两次武器池的开池机会，付费入口在时间上连续且密集。","linkage":"内容更新为新卡池提供「叙事理由」（新角色与主线剧情绑定），卡池为内容更新提供变现出口。","analysis":"42 天是一个经过验证的节奏：足够长以维持内容质量，足够短以维持付费频次。双卡池把 42 天切成两个 21 天的独立决策周期——玩家在一个版本内至少要做两到四次「抽不抽」的判断。付费触点的密度因此远高于单卡池结构，而每次决策又都足够轻，不至于让玩家产生被逼迫感。"},{"id":2,"seq":2,"topic":"限定角色 + 复刻轮转：可控的稀缺","content_side":"新五星角色只在限定祈愿中出场，不进入常驻池；角色按季度到半年的周期复刻。","monetization_side":"每次开池都是一次限时的销售窗口，玩家需要在窗口内完成付费决策。","linkage":"想获得只能等复刻，而复刻时间不确定——时间压力成为付费的驱动力。","analysis":"这是「可控稀缺」。如果角色进入常驻池，玩家的最优策略是永远不抽、坐等白嫖；如果永远不返场，玩家会因无力获得而流失。限定 + 定期复刻的组合，既维持了每次开池的紧迫感，又保留了长期希望。集录祈愿的推出进一步说明：官方在有意把「角色库存」盘活成一项可长期反复运营的资产。"},{"id":3,"seq":3,"topic":"深渊与剧诗：强度需求的「温和通胀」","content_side":"每期轮换渊月祝福与敌人组合，11-12 层对破盾、聚怪、元素循环提出明确要求。","monetization_side":"深渊本身不直接收费，但它定义了「练度」这个商品的市场价格——练度越值钱，树脂、纪行、抽卡的付费意愿就越高。","linkage":"练度需求 → 抽卡与养成需求 → 树脂与付费需求。深渊是整条付费链的需求发动机。","analysis":"这是原神长线运营中最克制、也最关键的一条设计红线：满星深渊并不需要当期新角色，四星队伍与复刻老角色同样能满星。这让「变强」始终是一个可达成但需要投入的目标——既制造了付费动机，又维持了「不氪也能玩」的正反馈。一旦深渊变成「不抽当期角色就打不过」，用户规模会迅速崩塌。"},{"id":4,"seq":4,"topic":"原粹树脂：把养成切成可出售的时间片","content_side":"树脂上限 200 点，每 8 分钟恢复 1 点，即每天自然恢复约 180 点；秘境与地脉各 20 点、世界 BOSS 40 点、周本 60 点（每周前 3 次半价）。","monetization_side":"树脂不够时，玩家可以选择买树脂、买纪行、或者等——这三种选择都直接或间接指向付费。","linkage":"树脂同时是「每日上线」的强约束：树脂会溢出，溢出就是损失，这构成了每天至少登录一次的动机。","analysis":"树脂的本质是把无限的刷取需求限制在有限的时间供给内。没有树脂，玩家可以在一天内刷完一个月的养成材料，付费需求会直接消失。树脂的存在，让「养成效率」本身成为一个可以出售的商品。它既控制了内容消耗速度，又创造了付费点，是这套商业模型里最精巧的一环。"},{"id":5,"seq":5,"topic":"空月祝福：用最低价格绑定每日登录","content_side":"月卡本身不出现在玩法内容里，它只承诺「每天给你 90 原石」。","monetization_side":"30 元换约 3000 原石当量（≈18.75 抽），单抽成本约 1.6 元，是直充的十分之一。","linkage":"原石必须每天登录领取且漏领不补——付费行为被转化成了持续一个月的行为约束。","analysis":"全游戏性价比最高的付费项。但它的真正功能不是赚钱，而是「绑定 DAU」：30 元的低门槛让大量玩家跨过第一次付费的心理门槛，而每日领取的动作又把登录变成习惯。这是典型的「低价高频 + 行为绑定」设计——收入和留存同时被买到。"},{"id":6,"seq":6,"topic":"纪行：出售养成效率，而不是角色","content_side":"纪行奖励绑定版本活跃度，需要完成任务提升等级才能领取。","monetization_side":"68 元（珍珠纪行）提供纠缠之缘、摩拉、经验书、天赋素材、一把 4★ 纪行武器，并额外给出 5 个脆弱树脂。","linkage":"奖励全部指向养成资源，恰好对应树脂系统的瓶颈；付费直接转化为「少刷几个小时」。","analysis":"纪行把付费与投入程度挂钩：越活跃的玩家越有动力买，买了之后又越舍不得中断。对休闲玩家而言，纪行等级拿不满则性价比骤降——这种「不买亏、买了也必须玩」的双向锁定，是它相比单纯卖资源的更高明之处。"},{"id":7,"seq":7,"topic":"直充关键：为「确定性」标价","content_side":"卡池的时间窗口有限（约 21 天），角色的获取不具备替代品。","monetization_side":"创世结晶共 6 档，首充双倍；648 档约合 16 元/抽，首充后约 8 元/抽。","linkage":"当距离大保底只差几十抽、而卡池即将关闭时，直充是唯一能解决问题的选项。","analysis":"直充是最贵的付费方式，但它服务的不是「想变强」，而是「不想功亏一篑」。保底、大保底、捕获明光、神铸定轨（5.0 起命定值由 2 点降为 1 点）这一整套机制，本质都是在给随机性标价：它们把「抽卡」从赌博改造成了一笔可以事先算清成本的分期购买。降低心理门槛，比提高价格更能抬升总收入。"},{"id":8,"seq":8,"topic":"角色装扮：纯外观付费保护数值平衡","content_side":"皮肤只改变角色的外观表现，不提供任何属性加成。","monetization_side":"以创世结晶计价（通常 1680），属于复购型、非必需型消费。","linkage":"为高付费用户提供表达欲与展示欲的出口，同时完全不影响不付费玩家的游戏体验。","analysis":"最「安全」的付费点。它不会破坏数值平衡，也不会让不付费玩家感到被碾压，却能在不增加开发风险的前提下提高单用户价值。对以角色情感联结为核心的产品而言，外观付费是利润率最高、口碑风险最小的收入来源。"},{"id":9,"seq":9,"topic":"内容—付费闭环：抽到角色只是开始","content_side":"新角色的突破素材绑定新地图的特产与新 BOSS 的材料。","monetization_side":"抽到角色之后，玩家需要投入树脂去刷素材，而树脂是有限且可购买的。","linkage":"探索新地图（产出原石）→ 抽卡（消耗原石）→ 养成（消耗树脂）→ 需要更多资源 → 继续探索与付费。","analysis":"闭环的关键在于「新角色需要新地图的素材」这个设定。它让抽到角色的那一刻不是消费的终点，而是下一轮投入的起点：玩家必须回到新地图采集特产、打新 BOSS，这既延长了新地图的生命周期，又让探索行为直接转化为养成投入。内容、抽卡、养成三条线因此被绑成一体。"},{"id":10,"seq":10,"topic":"免费产出与「零氪可行性」的校准","content_side":"每版本免费产出的原石（委托、深渊、活动、探索）保持在一个可观的量级。","monetization_side":"免费产出越低，付费动机越强，但用户规模会缩小；越高，则付费动机消失。","linkage":"校准目标是：零氪玩家能稳定获得大部分限定角色，只是比付费玩家慢。","analysis":"粗略量级（社区测算，非官方数据）：零氪每版本约 55-80 抽，月卡约 80-105 抽，月卡 + 纪行约 95-120 抽，含新地图的大版本会更高。以角色池平均约 62.5 抽出金计算，零氪大致每一到两个版本可以稳定拿到一个五星。这个区间是精心校准的结果——「能拿到，但要等」既保住了口碑与用户规模，也保住了付费动机。"},{"id":11,"seq":11,"topic":"概率公示：既是合规，也是说服","content_side":"游戏内公示各卡池的基础概率、综合概率、保底次数与规则说明。","monetization_side":"公示把「随机」呈现为「可计算的成本」，玩家可以用数学衡量一次付费值不值。","linkage":"透明的规则降低了「被坑」的感知，反而提升了付费转化。","analysis":"国内对抽取类玩法有概率公示的明确要求。原神在这一基础上做得更进一步：把保底、定轨、捕获明光等规则写得非常细。这既是合规动作，也是说服工具——当玩家能用「最多 180 抽一定能拿到」来规划预算时，抽卡在体验上就更接近「分期付款买一个角色」，而不是纯粹的赌运气。这是它相较传统抽卡手游争议较小的原因之一。"}],"incidents":[{"id":1,"code":"NEUV-4.8","name":"那维莱特高速旋转修复回退事件","version":"4.8","happened_on":"2024-07-17","resolved_on":"2024-07-18","category":"数值调整 / 玩家信任","severity":"高","summary":"官方在 4.8 版本限制了那维莱特重击的异常高速旋转，引发强烈反弹，次日发布说明致歉，宣布回退该修复并全服补偿原石 ×1600。","trigger":"4.8 版本更新实装了针对那维莱特重击旋转速率的修复。此前玩家可通过调整操作设备灵敏度或鼠标 DPI，让角色在重击时高速旋转并对大范围敌人造成伤害；而其他设备的玩家难以复现，且高速旋转下画面严重模糊。官方本意是在不影响常规操作伤害的前提下，把全屏旋转速率修复到合理范围，但修复上线后部分玩家反馈重击手感变差。值得注意的是，官方在 4.8 更新说明中把它归入「问题修复」，条目表述为「重击时可以异常高速旋转，导致角色能攻击到的范围出现异常」，并随更新补偿原石 ×100——也就是说，官方从来没有把它当成一次平衡性调整。玩家的反弹恰恰发生在这个分类上：他们要捍卫的不是某个 bug，而是「已拥有的角色不会被改动」这条预期。","official_response":"官方于 2024-07-18 发布说明：承认修复带给玩家不好的体验是自身考虑不周，郑重道歉；表示正在收集各渠道意见，决定在后续更新中回退该修复；同时公布全服补偿原石 ×1600，并说明具体更新时间与发放方案将另行公告。说明中另有两句关键表述：一是对已上线角色的修改，无论本意如何，都可能伤害玩家长期的支持与信任；二是今后对任何与已上线内容相关的决定都会更加谨慎。","compensation":"全服补偿原石 ×1600（约合 10 抽）；另有 4.8 版本更新时该修复条目自带的原石 ×100，两者性质不同","root_cause":"根因不在数值本身，而在「已上线角色」这条隐含红线。该修复在技术上可能成立，但它触碰的是一个与平衡性无关的东西：玩家对「已购买的角色不会被改动」的预期。官方把它定义为「修复异常」，玩家把它理解为「削弱我抽到的角色」——同一个动作，两套完全不同的分类系统。在抽卡制游戏中，角色是被出售的商品，且价格由随机性决定；一旦玩家认为已持有角色的强度可以被事后调整，每一次付费的确定性都会下降。官方最终选择回退，本质上是在为「付费确定性」付钱。","compliance_note":"事件事实依据：官方 4.8 版本更新说明与官方回退公告（中英文版页面）。回退的具体实装版本与日期官方从未单独公布，本库不作推定。补偿的发放条件与时间仅见于第三方报道。本库不保存公告原文段落，仅作要点转述。"},{"id":2,"code":"BARB-3.0","name":"芭芭拉水环与草原核挂水间隔调整","version":"3.0","happened_on":"2022-08-24","resolved_on":"","category":"数值调整 / 机制修复","severity":"中","summary":"3.0 版本前后，芭芭拉水环配合草原核产生的持续挂水效果被加入间隔限制，相关改动未伴随补偿，在玩家社群中引发「暗削」讨论。","trigger":"芭芭拉的水环在草元素反应体系下可与草原核联动，持续为敌人附着水元素，由此产生一套低成本但强度可观的反应流程。该交互被限制后，玩家社群对「已上线角色/机制被事后调整且不补偿」的讨论升温。","official_response":"官方未就此单独发布道歉或补偿性公告；相关改动通过版本机制调整体现。","compensation":"无公开补偿","root_cause":"与那维莱特事件构成对照：同样是「已上线内容被调整」，但未引发官方回退。差别在于改动形式（机制间隔限制 vs 直接的手感变化）与当时的舆论量级。记录此条的目的，是说明「不可削弱」这条约束并非一开始就存在，它是在一次次事件中被逐步加固的。","compliance_note":"本条主要依据玩家社群的公开讨论与第三方整理，未检索到对应的官方公告；版本与日期为对版本周期的推定，置信度低于那维莱特条目，仅作对照参考。"}],"incident_timeline":[{"id":1,"incident_id":1,"seq":1,"date_label":"2023-09-27","actor":"官方","event":"4.1 版本上线，那维莱特实装。其重击可通过调整操作设备灵敏度或鼠标 DPI 实现高速旋转，对战场大范围敌人造成伤害；该操作在其他设备上难以复现。","evidence":"角色实装日期为公开事实；高速旋转玩法为当时社群的普遍操作。"},{"id":2,"incident_id":1,"seq":2,"date_label":"2024-07-17","actor":"官方","event":"4.8 版本更新（当日 06:00 UTC+8 起维护）实装该修复。在 4.8 更新说明的「问题修复」分类下，条目表述为：那维莱特在重击时可以异常高速旋转，导致角色能攻击到的范围出现异常；该条随更新附带原石 ×100 的补偿。","evidence":"官方 4.8 版本更新说明。注意：这 100 原石属于版本更新的常规问题补偿，与后来的 1600 原石是两回事。"},{"id":3,"incident_id":1,"seq":3,"date_label":"2024-07-17","actor":"观察","event":"在官方口径中，这次改动属于「异常 / 问题修复」，而不是平衡性调整。但玩家社群并未按这个分类接受它——他们讨论的不是「这个 bug 该不该修」，而是「已经拥有的角色为什么可以被改」。","evidence":"依据是官方更新说明的分类与用词（「异常高速旋转」「范围出现异常」），与玩家侧讨论焦点的对比。"},{"id":4,"incident_id":1,"seq":4,"date_label":"2024-07-17","actor":"玩家","event":"修复上线当日即引发大量反馈，讨论主要集中在中国社区与社交平台。","evidence":"媒体报道（二手材料，未逐平台量化）。"},{"id":5,"incident_id":1,"seq":5,"date_label":"2024-07-18","actor":"官方","event":"发布《角色「谕告的潮音·那维莱特(水)」高速旋转问题修复回退情况说明》：郑重道歉，承认考虑不够周全，宣布在后续更新中回退该修复。","evidence":"官方公告，中英文版本均标注 2024-07-18 发布。"},{"id":6,"incident_id":1,"seq":6,"date_label":"2024-07-18","actor":"官方","event":"公布全服补偿：原石 ×1600（约合 10 抽），具体更新时间与发放方案另行公告。","evidence":"官方公告；多家媒体转载一致。"},{"id":7,"incident_id":1,"seq":7,"date_label":"2024-07-18","actor":"官方","event":"在说明中承诺：对已上线角色的修改无论本意如何都可能伤害玩家的支持与信任；今后对任何与已上线游戏内容相关的决定都会更加谨慎。","evidence":"官方公告中文表述的要点转述。"},{"id":8,"incident_id":1,"seq":8,"date_label":"2024-07-18","actor":"官方","event":"补偿开始发放（第三方报道称领取条件为冒险等阶 ≥5，邮件 30 天内有效）。","evidence":"第三方媒体报道，未见对应的官方发放公告，属二手信息。"},{"id":9,"incident_id":1,"seq":9,"date_label":"2024-08-28","actor":"观察","event":"5.0 版本更新说明中已不再出现该项回退的专项条目；官方从未单独公布回退的具体实装版本与日期，只承诺「在后续的更新中回退」。","evidence":"官方在回退公告中的措辞（未指明版本）＋ 5.0 更新说明中未见该专项。此条为核查结论，不代表回退未执行。"},{"id":10,"incident_id":2,"seq":1,"date_label":"2022-08-24","actor":"官方","event":"3.0 版本上线，草元素反应体系实装，水环与草原核的联动进入玩家视野。","evidence":"版本上线日期为公开事实。"},{"id":11,"incident_id":2,"seq":2,"date_label":"2022-08 至 2022-09","actor":"官方","event":"该联动被加入间隔限制，持续挂水效果不再成立。","evidence":"玩家社群讨论与第三方整理，未检索到对应官方公告。"},{"id":12,"incident_id":2,"seq":3,"date_label":"同期","actor":"玩家","event":"社群出现「暗削」讨论：已上线角色的机制被事后调整且无补偿。","evidence":"玩家社群舆论，属观点性材料。"}],"incident_impacts":[{"id":1,"incident_id":1,"seq":1,"dimension":"官方决策","horizon":"短期","impact":"「改动风险」被公开定价","mechanism":"全服补偿原石 ×1600（约 10 抽）为一次失败的改动标出了市场参照价。此后任何针对已上线内容的调整，玩家社群都会用同一标尺衡量，官方内部也会把这份成本计入方案评估。","evidence":"补偿方案公开、全服统一发放，数额明确且可折算。","confidence":"高","related_op":3,"note":"这不是惩罚，而是定价：它让「改旧内容」第一次有了可计算的舆论成本。"},{"id":2,"incident_id":1,"seq":2,"dimension":"官方决策","horizon":"长期","impact":"「不削弱已上线角色」从行业惯例升格为公开承诺","mechanism":"官方在说明中书面确认：对已上线角色的修改无论本意如何，都可能伤害玩家的支持与信任。这句话被社群长期保留下来，成为评判后续任何调整行为的标尺。","evidence":"官方公告原文表述（要点转述）。","confidence":"高","related_op":11,"note":"承诺一旦公开，就不再只是内部规范，而是可被引用的问责依据。"},{"id":3,"incident_id":1,"seq":3,"dimension":"官方决策","horizon":"中期","impact":"向下调整的决策成本被抬高，调整周期被拉长","mechanism":"在「不损伤老玩家信任」的门槛下，削弱型方案需要更高的论证强度，决策倾向从「及时修正」转为「宁可不改」。","evidence":"在本报告可检索到的公开资料范围内，4.8 之后未见针对已上线角色核心数值的主动削弱型调整。","confidence":"中","related_op":3,"note":"检索范围有限，此条为观察结论而非定论；不排除存在未被公开讨论的小幅调整。"},{"id":4,"incident_id":1,"seq":4,"dimension":"官方决策","horizon":"中期","impact":"官方转向「只做加法」的第三条路","mechanism":"既然不能削弱，就改为加强：6.2 起推出老角色加强计划，首批对 7 位蒙德老角色给予机制与数值加强。这是约束条件下的创造性解法——不做减法，也不接受旧角色直接报废。","evidence":"第三方媒体对 6.2 版本内容的转述。","confidence":"中","related_op":2,"note":"「加强老角色」缓解了相对贬值，但也意味着绝对数值水平上升得更快。"},{"id":5,"incident_id":1,"seq":5,"dimension":"角色供给","horizon":"长期","impact":"强度迭代只能向上，新角色必须比旧的更值得抽","mechanism":"当旧角色的强度不能被下调时，让新角色具备吸引力的可行手段只剩两条：更高的数值，或更完整的机制。两者都会推高供给侧的天花板。","evidence":"供给侧 DPS 量级在 4.x 与 5.x 各出现约 3 倍跃升（社区测算，仅取量级与方向）。","confidence":"中","related_op":1,"note":"这是本报告的核心机制：约束不是膨胀的原因，但是膨胀方向被锁死的原因。"},{"id":6,"incident_id":1,"seq":6,"dimension":"角色供给","horizon":"长期","impact":"用「新体系」替代「削弱旧体系」来控制环境","mechanism":"通过新元素反应或新专精体系重新定义强势队伍，让旧体系被绕开而不是被删弱。旧角色在数值上没有被剥夺任何东西，但环境不再为它设计。","evidence":"6.x 时期月反应体系的登场与新角色的体系绑定（社区测算与媒体转述）。","confidence":"中","related_op":6,"note":"这比直接削弱更温和，代价是体系数量持续累积、新玩家需要理解的概念变多。"},{"id":7,"incident_id":1,"seq":7,"dimension":"深渊需求","horizon":"长期","impact":"深渊血条与机制只能加不能减，成为唯一合法的难度调节阀","mechanism":"玩家的变强体感要求环境同步上移：一旦下调血量，「练度」这项商品的价值就会被稀释。在供给侧单向抬升的同时，需求侧只能被动跟随。","evidence":"12 层敌人总血量从 1.x 的约 300-380 万升至 5.x 的 2000 万以上（社区测算，仅取量级）。","confidence":"中","related_op":3,"note":"该口径只统计血条，不含护盾与狂猎等特殊机制；计入机制后实际门槛更高。"},{"id":8,"incident_id":1,"seq":8,"dimension":"深渊需求","horizon":"长期","impact":"难度来源从「数值」部分转移到「机制」","mechanism":"当面板血量增幅趋缓时，改以专属机制制造门槛，实际难度不再由血条体现。对玩家而言，这意味着「打得过」越来越依赖是否持有特定体系，而不是练度高低。","evidence":"6.x 期间血量增幅趋缓、专怪与体系专属机制增多的社群观察。","confidence":"低","related_op":3,"note":"此条主要来自玩家体感，缺乏可量化的公开统计，置信度低。"},{"id":9,"incident_id":1,"seq":9,"dimension":"玩家预期","horizon":"长期","impact":"「抽新不抽旧」成为理性策略","mechanism":"老角色没有被削弱，但被环境甩开——相对贬值以「相对」的形式实现，恰好绕过了「不削弱」的承诺。在这种环境下，把资源投向新角色是数学上更优的选择。","evidence":"复刻池与新池的角色强度与出场环境差异（社区测算与竞速圈统计）。","confidence":"中","related_op":2,"note":"这是「不削弱」承诺的一个副作用：它保护了角色的绝对强度，但没有保护它的相对价值。"},{"id":10,"incident_id":1,"seq":10,"dimension":"玩家预期","horizon":"短期","impact":"社群获得一次「集体施压成功」的经验","mechanism":"反馈在 24 小时内得到回应，并附带全服补偿。这降低了后续同类舆论施压的预期门槛，也让玩家更倾向于把不满直接转化为公开表达。","evidence":"事件时间线：修复上线当日引发反弹，次日即发布回退说明并公布补偿。","confidence":"中","related_op":11,"note":"对官方而言，这既是压力也是信号渠道；长期看会同时提高回应速度与回应成本。"},{"id":11,"incident_id":1,"seq":11,"dimension":"商业化","horizon":"中期","impact":"收入更依赖新角色首发，复刻池的相对价值被压缩","mechanism":"新池与旧池的价值差被环境持续拉大，复刻池对「追强度」玩家的吸引力随之下降，营收结构更依赖新角色的首次登场表现。","evidence":"第三方监测显示的国区收入同比下滑（第三方估算，且为多因素共同作用）。","confidence":"低","related_op":1,"note":"本报告不将该指标单独归因于本次事件；此处仅记录结构性倾向。"},{"id":12,"incident_id":1,"seq":12,"dimension":"商业化","horizon":"长期","impact":"「追赶成本」与「满星门槛」之间的张力成为长期风险","mechanism":"随着绝对数值水平单向累积，新玩家追赶既有内容所需的总投入随时间上升，而深渊门槛仍在同步上移。这可能抑制新用户的强度向转化。","evidence":"血量与输出天花板两条曲线的同步上移（均为社区测算）。","confidence":"低","related_op":3,"note":"缺乏官方留存与转化数据，此条为基于公开信息的风险提示，不作为结论。"},{"id":13,"incident_id":2,"seq":1,"dimension":"官方决策","horizon":"短期","impact":"「机制修复」与「削弱」在玩家感知中是同一件事","mechanism":"玩家并不区分「修 bug」与「砍数值」，只区分「我持有的东西是否被改变」。这让任何涉及已上线角色的改动都天然带有舆论风险。","evidence":"当时社群的「暗削」讨论。","confidence":"中","related_op":3,"note":"此条为对照条目，置信度低于那维莱特事件。"}],"inflation_metrics":[{"id":1,"category":"需求侧·深渊","metric":"12 层敌人总血量","period":"1.0 - 1.6（蒙德·璃月）","value_text":"约 300 万 - 380 万","direction":"上升","nature":"社区测算","source_note":"17173 转载的社区逐版本统计（2026-02）","note":"只统计敌人血条，不含护盾与狂猎等特殊机制。"},{"id":2,"category":"需求侧·深渊","metric":"12 层敌人总血量","period":"2.0 - 3.8（稻妻·须弥）","value_text":"约 600 万 - 1000 万","direction":"上升","nature":"社区测算","source_note":"同上","note":"区间宽，因为该跨度内版本众多、环境差异大。"},{"id":3,"category":"需求侧·深渊","metric":"12 层敌人总血量","period":"4.0 - 4.8（枫丹）","value_text":"约 1000 万 - 1400 万","direction":"上升","nature":"社区测算","source_note":"同上","note":"4.x 期间血量上移幅度最大，与那维莱特等角色的输出水平相关。"},     KB.abyss_rewards.map(r=>'<tr><td><b>'+esc(r.scope)+'</b></td><td>'+esc(r.item)+'</td>'+

    (()=>{
      const nm = KB.primogem_income.find(r=>r.period.indexOf("不定期")===0);

      avg = Math.max(1, 90 - pity);
      label = big?"大保底":"小保底";

    kpi("材料条目", fmt(items.length), "条", runs.length+" 个处理批次", "")+
    kpi("人工投喂", fmt(manual.length), "条", "正文原样保留", "g")+
    kpi("第三方接口镜像", fmt(mirror.length), "条", "只留标题与派生概括", "b")+
    kpi("模型概括", fmt(sums.length), "条", "每条材料选 1 条主概括", "p")+
    kpi("观察报告", fmt(reps.length), "份", "其中 "+primReps.length+" 份为主报告", "")+

  /* ---------- 两条线 ---------- */
  h += '<div class="card"><h2>同样是「材料」，两条线的合规性质完全不同<span class="en">Two Lines</span></h2>'+

    '<div class="grid2">'+
      '<div class="note ok"><b>人工投喂线 · '+manual.length+' 条</b><br>'+

    '</div>'+
    '<h3>批次台账<span class="en">maf_runs · '+runs.length+' 行</span></h3>'+
    '<div class="tw"><table><thead><tr><th>批次</th><th>来源库</th><th>主题</th><th>线路</th>'+

    runs.map(r=>'<tr><td class="num">'+r.orig_run_id+'</td><td><code>'+esc(r.source_db)+'</code></td>'+
      '<td>'+esc(r.subject||"—")+'</td>'+
      '<td>'+tag(r.origin, r.origin==="人工投喂"?"gold":"gray")+'</td>'+
      '<td class="muted">'+esc((r.started_at||"").slice(0,10))+'</td>'+
      '<td class="num">'+fmt(r.inserted)+' / '+fmt(r.updated)+'</td>'+

      '<td class="muted" style="font-size:11.5px">'+esc(r.note||"")+'</td></tr>').join("")+
    '</tbody></table></div>'+
    '<p class="muted" style="font-size:11.5px">采到 0 条的批次不是失败：条目按内容指纹去重，'+

  /* ---------- 材料清单 ---------- */
  h += '<div class="card"><h2>材料清单<span class="en">maf_items · '+items.length+' 行</span></h2>'+
    '<p class="lead">按发布时间排序，「日期未知」排最后 —— 与 maf 内部 '+
    '<code>ORDER BY created_at ASC, post_id ASC</code> 的顺序一致。</p>'+
    bars(kRows,"#0f8c86"," 条")+
    '<div class="tw"><table><thead><tr><th>#</th><th>日期</th><th>标题</th><th>类别</th>'+
    '<th>线路</th><th>主概括</th><th>挂到知识库</th></tr></thead><tbody>'+
    items.map(i=>{
      const s = primSum[i.id];
      const lk = linkByItem[i.id]||[];
      const lkTxt = lk.length
        ? lk.map(l=>tag(l.kind+" · "+l.ref_key,
            l.kind==="版本"?"blue":(l.kind==="角色"?"purple":"red"))).join(" ")
        : '<span class="muted">—</span>';
      const body = (i.origin==="人工投喂" && i.body)
        ? '<details style="margin-top:4px"><summary class="muted" '+
          'style="cursor:pointer;font-size:11.5px">看正文（自己粘贴的材料）</summary>'+
          '<div style="font-size:12.4px;color:var(--ink2);margin-top:4px;white-space:pre-wrap">'+
          esc(i.body)+'</div></details>'
        : '<div class="muted" style="font-size:11px;margin-top:4px">正文未收录</div>';
      return '<tr><td class="num">'+i.seq+'</td>'+

        '<td>'+tag(KIND_CN[i.kind]||i.kind, KIND_TAG[i.kind]||"gray")+'</td>'+
        '<td>'+tag(i.origin, i.origin==="人工投喂"?"gold":"gray")+'</td>'+
        '<td style="font-size:12.4px">'+esc(s?s.summary:"（无概括）")+
          (s?'<div class="muted" style="font-size:11px">'+esc(s.backend)+' / '+esc(s.model)+'</div>':'')+'</td>'+
        '<td>'+lkTxt+'</td></tr>';
    }).join("")+
    '</tbody></table></div></div>';

  /* ---------- 关联 ---------- */
  const verMap = {};
  links.filter(l=>l.kind==="版本").forEach(l=>{
    verMap[l.ref_key] = verMap[l.ref_key] || 0;
    verMap[l.ref_key]++;
  });
  const verRows = Object.keys(verMap).sort().map(k=>["v"+k, verMap[k]]);
  const kindsCount = {};
  links.forEach(l=>{ kindsCount[l.kind] = (kindsCount[l.kind]||0)+1; });

  h += '<div class="card"><h2>材料怎么挂到知识库上<span class="en">maf_item_links · '+links.length+' 行</span></h2>'+
    '<p class="lead">桥接脚本会从材料的标题、主概括和正文里做<b>纯字符串匹配</b>，把材料挂到已有的角色、版本、运营事故上。'+
    '匹配可以错，但必须能追溯，所以每条关联都记下命中词（<code>matched_by</code>）与把握程度（<code>confidence</code>）。</p>'+
    '<div class="grid2">'+
      kv("关联总数", fmt(links.length)+" 条")+

        : "—")+
    '</div>'+
    (verRows.length
      ? '<h3>材料指向的版本</h3>'+bars(verRows,"#3d8fd1"," 条")+

        '「月之七」这类命名按 <code>meta.game_version_note</code> 的规则换算成 6.6。'+
        '所以同一条材料可能同时标出 6.6 与 7.0 —— 那是「预告 7.0」这种标题的真实含义。</p>'
      : '')+
    '<div class="note warn"><b>角色与运营事故的关联数是 0，这是数据事实，不是匹配失败。</b><br>'+
    '这 54 条材料里<b>没有出现知识库收录的 61 位角色中的任何一位</b>——'+
    '材料集中在 2026 年的 7.x 公告，而角色表最远只到 5.3 的纳塔角色。'+
    '脚本不会把没出现的名字硬挂上去：宁可关联为空，也不要一条查不出出处的关联。</div></div>';

  /* ---------- 观察报告 ---------- */
  h += '<div class="card"><h2>观察报告<span class="en">maf_reports · '+reps.length+' 份</span></h2>'+
    '<p class="lead">maf 把一批材料交给模型，产出两份东西：<b>时间轴</b>（按时间排列的条目叙事）与'+
    '<b>观察报告</b>（对这批材料的归纳）。下面展开每个来源库各一份主报告'+
    '（云端 &gt; 本地模型 &gt; 桩程序）。</p>'+
    primReps.map(r=>'<details class="op"><summary>'+esc(r.origin)+' · '+esc(r.source_db)+
      ' · '+r.items+' 条材料 · '+esc(r.span||"")+
      ' <span class="muted">（'+esc(r.backend)+' / '+esc(r.model)+'）</span></summary>'+
      '<div class="bd"><h3>时间轴</h3>'+
      '<div style="white-space:pre-wrap;font-size:12.6px;color:var(--ink2)">'+esc(r.timeline||"")+'</div>'+
      '<h3>观察报告</h3>'+
      '<div class="ana" style="white-space:pre-wrap">'+esc(r.report||"")+'</div></div></details>').join("")+
    '<p class="muted" style="font-size:11.5px">其余 '+(reps.length-primReps.length)+
    ' 份报告是同一批材料在不同批次或不同模型下的重复处理结果，保留在库里但不在页面上展开。</p>'+
    '<div class="note warn"><b>这些文字是模型生成的归纳，不是官方表述。</b>'+
    '它可能读错、可能遗漏，也可能把两件事混成一件。把它当作「这批材料大概说了什么」的索引，'+
    '需要引用时请回到材料本身的出处。</div></div>';

  /* ---------- 怎么接进来的 ---------- */
  h += '<div class="card"><h2>这条线是怎么接进来的<span class="en">How It Connects</span></h2>'+
    '<ul class="tight">'+
      '<li><b>maf 在 <code>maf/</code></b>：一个独立的内容观察工作台'+
      '（本地模型概括 → 时间轴 → 观察报告 → PPT / Word / PDF）。'+
      '它<b>不访问任何网络接口、不抓取任何站点、不使用任何游戏客户端文件</b>，'+
      '唯一入口是使用者拖入或粘贴的文本。</li>'+
      '<li><b>桥接脚本 <code>scripts/import_maf.py</code></b>：只用 <code>sqlite3</code> 直接读 maf 的两个库，'+
      '<b>不 import maf 的 Python 模块</b> —— 所以跑它不需要 maf 的虚拟环境，也不会被 maf 的代码改动带崩。</li>'+
      '<li><b>幂等</b>：每次运行先清空 20-24 号表再重建，跑多少次结果都一样；'+
      '它不碰 1-19 号表（那些来自手写的 <code>scripts/kb_data.py</code>）。</li>'+
      '<li><b>顺序</b>：<code>init_db.py</code> → <code>import_maf.py</code> → <code>build_site.py</code>。'+
      '注意 <code>init_db.py</code> 会清空 maf 表，所以导入必须排在它后面。</li>'+
      '<li><b>先看再导</b>：<code>python scripts/import_maf.py --dry-run</code> 只报告不写库。</li>'+
    '</ul>'+
    '<div class="note"><b>数字不交给模型</b>：这条设计沿用自 maf —— 日期靠规则解析'+
    '（抽不到就写「日期未知」，绝不编），统计量由时间轴直接算出，模型只负责出要点。</div></div>';

  $("#tab-materials").innerHTML = h;
})();

  let h = sectionHead("养成资源与树脂","Resin & Resources",

    '<div class="kpis">'+
      kpi("自然恢复速度","8","<small>分钟 / 点</small>","消耗掉的树脂会自动回补")+
      kpi("持有上限","200","<small>点</small>","1.1 版 160 → 4.7 版提升至 200","b")+
      kpi("每日自然恢复","180","<small>点</small>","从 0 回满 200 点需 26 小时 40 分","g")+
    '</div>'+
    '<div class="note warn">树脂<b>溢出即损失</b>：达到上限后将停止恢复。这就是「每天至少上线一次」的硬约束来源——'+

    '<h4>补充方式</h4><ul class="tight">'+
      '<li><b>脆弱树脂</b>：立即补充 60 点，无期限，主要来自纪行与冒险等阶奖励。</li>'+
      '<li><b>须臾树脂</b>：补充 60 点但有使用期限，来自尘歌壶兑换。</li>'+
      '<li><b>原石购买</b>：每日限 6 次，价格逐次递增（50→100→150→200 原石），越买越贵。</li>'+
    '</ul><p class="muted">补充方式的价格递增设计很典型：它允许玩家应急，但不允许玩家无限地用钱抹平时间差。</p></div>';

  h += '<div class="card"><h2>树脂去向一览<span class="en">Where Resin Goes</span></h2>'+
    '<div class="tw"><table><thead><tr><th>用途</th><th>树脂消耗</th><th>每周限制</th>'+
    '<th>产出</th><th>优先级</th><th>说明</th></tr></thead><tbody>'+
    KB.resources.map(r=>'<tr><td><b>'+esc(r.name)+'</b></td><td class="num">'+r.resin_cost+' 点</td>'+
      '<td class="muted">'+esc(r.weekly_limit)+'</td><td>'+esc(r.output)+'</td>'+
      '<td>'+tag(r.priority, r.priority.indexOf("最高")>=0?"red":r.priority.indexOf("必做")>=0?"gold":"gray")+'</td>'+
      '<td class="muted">'+esc(r.note)+'</td></tr>').join("")+
    '</tbody></table></div>'+
    '<div class="note ok">周本每周前 3 次为半价（30 点），是树脂性价比最高的去处；'+
    '树脂紧张时优先保证这 3 次，再规划其余消耗。</div></div>';

  h += '<div class="card"><h2>每日树脂预算<span class="en">Daily Resin Planner</span></h2>'+
    '<p class="lead">拖动滑块规划每天的刷取安排，看看是否超出每日自然恢复量。'+
    '每日自然恢复约 180 点，从 0 回满 200 点需要 26 小时 40 分。</p>'+
    '<div class="calc"><div class="crow" id="rSliders"></div><div class="out" id="rOut"></div></div></div>';

  $("#tab-resources").innerHTML = h;

  const cfg=[["秘境 · 地脉（20 点/次）",20,12],["世界 BOSS（40 点/次）",40,4],["周本（按 60 点/次计）",60,3]];
  const rv = cfg.map(c=>0);
  $("#rSliders").innerHTML = cfg.map((c,i)=>
    '<div class="fld"><label>'+c[0]+' <b id="rv'+i+'">0</b> 次</label>'+
    '<input type="range" min="0" max="'+c[2]+'" value="0" data-i="'+i+'"></div>').join("");
  $("#rSliders").querySelectorAll("input").forEach(inp=>{
    inp.oninput=()=>{ rv[inp.dataset.i]=+inp.value; $("#rv"+inp.dataset.i).textContent=inp.value; rcalc(); };

      out("等价每日上线次数", Math.ceil(Math.max(1,cost)/180)+" 次");
  }
  rcalc();
})();

(function chars(){
  let h = sectionHead("角色速查","Characters",
    "这是一份为配队服务的<b>角色索引</b>，不是完整图鉴。"+
    "字段只保留配队时会用到的信息（元素、武器、定位、是否限定）。"+
    '<span class="pill warnp">标注「待核验」的角色来自较新版本，使用前请对照游戏内说明</span>');

  const els=[...new Set(KB.characters.map(c=>c.element))];
  const wps=[...new Set(KB.characters.map(c=>c.weapon))];
  h += '<div class="card"><h2>筛选<span class="en">Filter</span></h2>'+
    '<h4>元素</h4><div class="filters" id="cfE"></div>'+
    '<h4>武器</h4><div class="filters" id="cfW"></div>'+
    '<h4>星级</h4><div class="filters" id="cfR"></div>'+
    '<div class="tw"><table><thead><tr><th>角色</th><th>元素</th><th>武器</th><th>星级</th>'+
    '<th>地区</th><th>定位</th><th>获取</th><th>首登版本</th></tr></thead><tbody id="cbody"></tbody></table></div>'+
    '<p class="muted" id="ccount"></p></div>';

  $("#tab-chars").innerHTML = h;

  let fe=null,fw=null,fr=null;
  mk("cfE",els,els.map(e=>'<span class="el '+e+'">'+e+'</span>'),v=>{fe=v;rc();});
  mk("cfW",wps,wps,v=>{fw=v;rc();});
  mk("cfR",["5","4"],["5★","4★"],v=>{fr=v;rc();});

  function mk(wrap,vals,labels,cb){
    const w=$("#"+wrap);
    [[null,"全部"],...vals.map((v,i)=>[v,labels[i]])].forEach(([v,lb],i)=>{
      const b=document.createElement("button");
      b.innerHTML=lb; if(i===0)b.classList.add("on");
      b.onclick=()=>{ w.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
        b.classList.add("on"); cb(v); };
      w.appendChild(b);
    });
  }
  function rc(){
    const list = KB.characters.filter(c=>
      (!fe||c.element===fe)&&(!fw||c.weapon===fw)&&(!fr||c.rarity===+fr));
    $("#cbody").innerHTML = list.map(c=>
      '<tr><td><b>'+esc(c.name)+'</b> '+(c.confidence!=="高"?'<span class="pill warnp">待核验</span>':"")+'</td>'+
      '<td>'+elBadge(c.element)+'</td><td>'+esc(c.weapon)+'</td>'+
      '<td>'+'★'.repeat(c.rarity)+'</td><td>'+esc(c.region)+'</td>'+
      '<td>'+(c.roles||"").split(",").map(r=>tag(r,"gray")).join("")+'</td>'+
      '<td>'+(c.limited?"限定":"常驻")+'</td><td class="muted">'+esc(c.version_added)+'</td></tr>').join("")
      || '<tr><td colspan="8" class="muted">没有匹配的角色。</td></tr>';
    $("#ccount").textContent = "共 "+list.length+" 条（全库 "+KB.characters.length+" 条）";
  }
  rc();
})();

function kv(k,v){
  return '<div style="background:#fafcfd;border:1px solid var(--line);border-radius:9px;padding:11px 14px">'+
    '<div class="muted" style="font-size:11.5px">'+esc(k)+'</div>'+
    '<div style="font-weight:600;margin-top:2px">'+v+'</div></div>';
}

/* ============================================================
   全局搜索
   ============================================================ */
(function search(){
  const M = Object.fromEntries(KB.meta.map(m=>[m.key,m.value]));
  const chip=document.getElementById("chipVer");
  if(chip) chip.textContent = "数据基准 · " + (M.baseline_version||"") + " · 核验 " + (M.accessed_at||"");

  const q=$("#q"), sr=$("#sr");
  function build(kw){
    const k=kw.toLowerCase();
    const g=[];
    const tm=KB.teams.filter(t=>[t.name,t.summary,t.archetype,t.strengths,t.weaknesses].join(" ").toLowerCase().includes(k));
    if(tm.length) g.push(["队伍 / 配队", tm.slice(0,6).map(t=>({t:t.name,s:t.archetype,go:"teams"}))]);
    const ch=KB.characters.filter(c=>[c.name,c.element,c.weapon,c.roles,c.region].join(" ").toLowerCase().includes(k));
    if(ch.length) g.push(["角色", ch.slice(0,6).map(c=>({t:c.name,s:c.element+" · "+c.weapon,go:"chars"}))]);
    const op=KB.operations.filter(o=>[o.topic,o.content_side,o.monetization_side,o.linkage,o.analysis].join(" ").toLowerCase().includes(k));
    if(op.length) g.push(["运营机制", op.slice(0,6).map(o=>({t:o.topic,s:"第 "+o.seq+" 条",go:"ops"}))]);
    const am=KB.abyss_mechanics.filter(m=>[m.name,m.description,m.strategy].join(" ").toLowerCase().includes(k));
    if(am.length) g.push(["深渊机制", am.slice(0,6).map(m=>({t:m.name,s:m.category,go:"abyss"}))]);
    const rx=KB.reactions.filter(r=>[r.name,r.elements,r.note].join(" ").toLowerCase().includes(k));
    if(rx.length) g.push(["元素反应", rx.slice(0,6).map(r=>({t:r.name,s:r.elements,go:"teams"}))]);
    const ic=KB.incidents.filter(i=>[i.name,i.summary,i.trigger,i.official_response,i.root_cause].join(" ").toLowerCase().includes(k));
    if(ic.length) g.push(["运营事故", ic.slice(0,6).map(i=>({t:i.name,s:i.version+" · "+i.category,go:"incident"}))]);
    const ifl=(KB.incident_impacts||[]).filter(x=>[x.dimension,x.impact,x.mechanism].join(" ").toLowerCase().includes(k));
    if(ifl.length) g.push(["长期影响", ifl.slice(0,6).map(x=>({t:x.impact,s:x.dimension+" · "+x.horizon,go:"incident"}))]);
    const imt=(KB.inflation_metrics||[]).filter(x=>[x.category,x.metric,x.period,x.value_text].join(" ").toLowerCase().includes(k));
    if(imt.length) g.push(["膨胀观测", imt.slice(0,6).map(x=>({t:x.metric,s:x.period+" · "+x.value_text,go:"incident"}))]);
    const mSum={}; (KB.maf_summaries||[]).filter(s=>s.is_primary).forEach(s=>{ mSum[s.item_id]=s.summary; });
    const mi=(KB.maf_items||[]).filter(x=>[x.title,x.date_label,x.kind,x.origin,mSum[x.id]||""].join(" ").toLowerCase().includes(k));
    if(mi.length) g.push(["观察材料", mi.slice(0,6).map(x=>({t:x.title,s:x.date_label+" · "+x.origin,go:"materials"}))]);
    const mr=(KB.maf_reports||[]).filter(x=>[x.origin,x.span,x.backend,x.model].join(" ").toLowerCase().includes(k));
    if(mr.length) g.push(["观察报告", mr.slice(0,6).map(x=>({t:x.origin+" · "+x.source_db,s:x.items+" 条材料 · "+x.span,go:"materials"}))]);
    return g;
  }
  function render(){
    const kw=q.value.trim();
    if(kw.length<1){ sr.style.display="none"; return; }
    const g=build(kw);
    if(!g.length){ sr.innerHTML='<div class="it muted">没有找到匹配内容</div>'; sr.style.display="block"; return; }
    sr.innerHTML = g.map(([grp,items])=>
      '<div class="grp">'+esc(grp)+'（'+items.length+'）</div>'+
      items.map(i=>'<div class="it" data-go="'+i.go+'">'+esc(i.t)+'<small>'+esc(i.s)+'</small></div>').join("")
    ).join("");
    sr.style.display="block";
    sr.querySelectorAll(".it").forEach(it=>{
      it.onclick=()=>{ if(it.dataset.go){ go(it.dataset.go); } sr.style.display="none"; q.value=""; };
    });
  }
  q.addEventListener("input",render);
  q.addEventListener("focus",render);
  document.addEventListener("click",e=>{
    if(!e.target.closest(".searchbox")) sr.style.display="none";
  });
})();

/* 默认打开第一个标签 */
go("overview");
</script>
